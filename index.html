<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think More Think Less</title>
<style>
:root { --bg: #2fa1fc; --paper: #ffffff; --ink: #14233a; --accent: #e2338a; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1522; --paper: #162133; --ink: #e8eef8; --accent: #ff5fa8; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
  font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; color: var(--ink); }
main { background: var(--paper); border-radius: 22px; padding: 28px 24px; margin: 16px; max-width: 420px; text-align: center; }
h1 { margin: 0 0 4px; font-size: 1.6em; }
p { margin: 4px 0 18px; }
a { display: inline-block; margin: 4px; padding: 8px 18px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Think More Think Less</h1>
<p lang="ar" dir="rtl">فكّر أكثر فكّر أقل</p>
<a href="privacy/#en">Privacy Policy</a>
<a href="privacy/#ar" lang="ar">سياسة الخصوصية</a>
</main>
</body>
</html>
